name: Daily News Fetch

# Fetch runs HERE in GitHub Actions — full unrestricted internet access,
# no Render networking limitations. Render only serves the API (reads DB).
#
# GitHub will NOT disable this because keepalive.yml commits a file on the
# 1st of every month, keeping the repo active.

on:
  schedule:
    - cron: '0 6 * * *'    # 06:00 UTC daily  (09:00 AST)
    - cron: '0 12 * * *'   # 12:00 UTC daily  (15:00 AST)
    - cron: '0 18 * * *'   # 18:00 UTC daily  (21:00 AST)
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      # ── 1. Checkout (needed to get fetch-articles.mjs and package.json) ──────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node ────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fetch-package.json

      # ── 3. Install fetch script dependencies ──────────────────────────────────
      - name: Install dependencies
        run: npm install --prefix . pg drizzle-orm rss-parser

      # ── 4. Run the fetch script — writes directly to Neon DB ─────────────────
      - name: Fetch and store articles
        id: fetch
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          RSS2JSON_API_KEY: ${{ secrets.RSS2JSON_API_KEY }}
        run: |
          node fetch-articles.mjs 2>&1 | tee fetch-output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          # Extract total from script output
          TOTAL=$(grep -oP 'Total new articles: \K[0-9]+' fetch-output.txt || echo "0")
          echo "articles_fetched=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "fetch_exit=$EXIT_CODE"   >> "$GITHUB_OUTPUT"

          exit $EXIT_CODE

      # ── 5. Wake Render so it's ready to serve the fresh articles ─────────────
      - name: Wake Render API
        if: always()
        run: |
          curl -s --max-time 30 \
            https://arabian-startups-api.onrender.com/api/healthz || true

      # ── 6. Verify via /api/status ─────────────────────────────────────────────
      - name: Verify fetch run recorded in DB
        id: status_check
        if: success()
        run: |
          # Give Render a moment to wake if it was asleep
          sleep 5
          STATUS=$(curl -s --max-time 30 \
            https://arabian-startups-api.onrender.com/api/status)
          echo "Status: $STATUS"

          TOTAL=$(echo "$STATUS"   | jq -r '.lastFetchTotal // 0')
          LAST_AT=$(echo "$STATUS" | jq -r '.lastFetchAt // "null"')
          DEAD_FEEDS=$(echo "$STATUS" | jq -r '
            if (.deadFeeds | length) > 0
            then "Dead feeds: " + (.deadFeeds | join(", "))
            else "All feeds active"
            end')

          echo "lastFetchTotal=$TOTAL  lastFetchAt=$LAST_AT"
          echo "$DEAD_FEEDS"
          echo "dead_feeds=$DEAD_FEEDS" >> "$GITHUB_OUTPUT"

          if [ -n "$DEAD_FEEDS" ] && [ "$DEAD_FEEDS" != "All feeds active" ]; then
            echo "::warning::$DEAD_FEEDS"
          fi

      # ── 7. Open / update GitHub issue on failure ──────────────────────────────
      - name: Open GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today  = new Date().toISOString().slice(0, 10);
            const title  = `🚨 Daily fetch failed — ${today}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const dead   = `${{ steps.status_check.outputs.dead_feeds || 'unknown' }}`;

            const body = [
              `**Run:** ${runUrl}`,
              `**Time:** ${new Date().toISOString()}`,
              `**${dead}**`,
              ``,
              `**Likely causes:**`,
              `- Feed URLs returning errors (check fetch-output.txt in run logs)`,
              `- \`DATABASE_URL\` secret missing or expired`,
              `- \`RSS2JSON_API_KEY\` missing (needed for bot-blocking feeds)`,
              ``,
              `**Check:** Run logs above → "Fetch and store articles" step for per-feed errors.`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'fetch-failure',
            });
            const todayIssue = existing.find(i => i.title === title);
            if (todayIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: todayIssue.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['fetch-failure'],
              });
            }
