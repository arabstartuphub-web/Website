name: Daily News Fetch

# THREE independent trigger layers — if any one fires, articles get fetched.
#
# Layer 1: GitHub scheduled cron (primary)
# Layer 2: cron-job.org dispatches via GitHub API (external backup)  
# Layer 3: Manual workflow_dispatch (for testing / emergency re-run)
#
# Render only SERVES the API. Fetching always runs here in GitHub Actions
# because Render free tier has DNS restrictions that block outbound RSS fetches.

on:
  schedule:
    - cron: '0 6 * * *'    # 06:00 UTC (09:00 AST)
    - cron: '0 14 * * *'   # 14:00 UTC (17:00 AST)
  repository_dispatch:
    types: [trigger-fetch]  # cron-job.org sends this event type
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install pg drizzle-orm rss-parser

      # ── Core step: fetch RSS feeds → write to Neon DB ──────────────────────
      - name: Fetch and store articles
        id: fetch
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          RSS2JSON_API_KEY: ${{ secrets.RSS2JSON_API_KEY }}
        run: |
          echo "Triggered by: ${{ github.event_name }} (${{ github.event.action || 'scheduled' }})"
          node fetch-articles.mjs 2>&1 | tee fetch-output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          TOTAL=$(grep -oP 'Total new articles: \K[0-9]+' fetch-output.txt || echo "0")
          echo "articles_fetched=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "📦 Articles fetched this run: $TOTAL"
          exit $EXIT_CODE

      # ── Wake Render so it's ready to serve the fresh articles ──────────────
      - name: Wake Render API
        if: always()
        run: |
          curl -s --max-time 60 \
            https://arabian-startups-api.onrender.com/api/healthz || true
          echo "Render pinged."

      # ── Check /api/status for dead feed warnings ────────────────────────────
      - name: Check feed health via /api/status
        id: status_check
        if: success()
        run: |
          sleep 5
          STATUS=$(curl -s --max-time 30 \
            https://arabian-startups-api.onrender.com/api/status || echo '{}')
          echo "Status response: $STATUS"

          DEAD=$(echo "$STATUS" | jq -r '
            if (.deadFeeds | length) > 0
            then "Dead feeds: " + (.deadFeeds | join(", "))
            else "All feeds active"
            end' 2>/dev/null || echo "status endpoint unreachable")

          echo "$DEAD"
          echo "dead_feeds=$DEAD" >> "$GITHUB_OUTPUT"
          if [[ "$DEAD" != "All feeds active" && "$DEAD" != "status endpoint unreachable" ]]; then
            echo "::warning::$DEAD"
          fi

      # ── Open / update a GitHub issue on any failure ─────────────────────────
      - name: Open GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today  = new Date().toISOString().slice(0, 10);
            const title  = `🚨 Daily fetch failed — ${today}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const dead   = `${{ steps.status_check.outputs.dead_feeds || 'see run logs' }}`;
            const trigger = `${{ github.event_name }}`;

            const body = [
              `**Triggered by:** ${trigger}`,
              `**Run:** ${runUrl}`,
              `**Time:** ${new Date().toISOString()}`,
              `**${dead}**`,
              ``,
              `**Likely causes:**`,
              `- Feed errors — check "Fetch and store articles" step logs`,
              `- \`DATABASE_URL\` secret missing or expired`,
              `- \`RSS2JSON_API_KEY\` missing (needed for bot-blocking feeds)`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'fetch-failure',
            });
            const todayIssue = existing.find(i => i.title === title);
            if (todayIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: todayIssue.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['fetch-failure'],
              });
            }
