name: Daily News Fetch

on:
  schedule:
    # Run twice daily: 07:00 and 19:00 UTC (10:00 and 22:00 AST)
    # Two runs/day = 72 rss2json requests/day — safely within free quota.
    # Staggered from server's internal cron (00:00, 06:00, 12:00, 18:00 UTC).
    - cron: '0 7 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API server (Render free tier sleeps after 15 min)
        run: |
          echo "Pinging health endpoint to wake Render service..."
          curl -s https://arabian-startups-api.onrender.com/api/healthz || true

      - name: Wait for service to be ready (up to 3 min)
        run: |
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://arabian-startups-api.onrender.com/api/healthz 2>/dev/null || echo "000")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Service is up!"
              break
            fi
            sleep 10
          done

      - name: Trigger news fetch
        run: |
          echo "Triggering fetch..."
          RESPONSE=$(curl -s -X POST https://arabian-startups-api.onrender.com/api/init \
            -H "Content-Type: application/json" \
            --max-time 180)
          echo "Response: $RESPONSE"
          # Fail the job if the response contains success:false
          echo "$RESPONSE" | grep -q '"success":false' && exit 1 || true
          echo "Done."
