name: Keep Workflows Alive

# GitHub disables scheduled workflows after 60 days of repo inactivity.
# This workflow runs on the 1st of every month, commits a timestamp,
# which counts as repo activity and prevents GitHub from disabling any
# other scheduled workflows. It is entirely self-sustaining.

on:
  schedule:
    - cron: '0 0 1 * *'   # 1st of every month at 00:00 UTC
  workflow_dispatch:        # allow manual trigger just in case

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit keep-alive timestamp
        run: |
          echo "Last auto-keepalive: $(date -u '+%Y-%m-%d %H:%M UTC')" > .github/last-alive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-alive.txt
          # Only commit if there's actually a change (idempotent)
          git diff --staged --quiet \
            || git commit -m "chore: keep workflows alive [$(date -u +%Y-%m)]"
          git push
