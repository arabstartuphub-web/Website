services:
  # API Server (Express + Node.js)
  - type: web
    name: arabian-startups-api
    runtime: node
    rootDir: .
    buildCommand: "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/db run push && pnpm --filter @workspace/api-server run build"
    startCommand: "node artifacts/api-server/dist/index.mjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: arabian-startups-db
          property: connectionString
    healthCheckPath: /api/healthz

  # Frontend (React + Vite — served as static files)
  - type: web
    name: arabian-startups-web
    runtime: static
    rootDir: .
    buildCommand: "npm install -g pnpm && pnpm install --frozen-lockfile && BASE_PATH=/ PORT=3000 pnpm --filter @workspace/arabian-startups run build"
    staticPublishPath: artifacts/arabian-startups/dist/public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://arabian-startups-api.onrender.com/api/$1
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production

databases:
  - name: arabian-startups-db
    databaseName: arabian_startups
    plan: free
