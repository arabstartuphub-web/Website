# Render deployment config for Arabian Startups Ecosystem
# This uses two separate services (free tier) instead of a Blueprint (paid).
# 
# How to deploy:
# 1. Push this repo to GitHub
# 2. In Render Dashboard, click "New +" and create two services:
#    a) "Web Service" for the API (Node.js)
#    b) "Static Site" for the frontend
# 3. Set the environment variables shown below for each service
# 4. The frontend static site needs a Rewrite rule to route /api/* to your API
#
# IMPORTANT: After the API is deployed, copy its URL and set VITE_API_URL
#            on the Static Site service.
#
# If you need the cron job, upgrade the API service to a paid plan (at least
# Render Starter), or use a separate cron trigger (e.g., UptimeRobot pinging
# /api/healthz every 10 minutes to keep the free service alive).

# === SERVICE 1: API Server (Node.js) ===
# Render service type: Web Service
# Runtime: Node
# Build Command: npm install -g pnpm && pnpm install && pnpm --filter @workspace/db run push && pnpm --filter @workspace/api-server run build
# Start Command: node artifacts/api-server/dist/index.mjs
# Health Check Path: /api/healthz
# Environment Variables:
#   NODE_ENV = production
#   PORT = 10000
#   BASE_PATH = /api
#   DATABASE_URL = <your Neon connection string>

# === SERVICE 2: Frontend (Static Site) ===
# Render service type: Static Site
# Build Command: npm install -g pnpm && pnpm install && VITE_API_URL=https://arabian-startups-api.onrender.com/api BASE_PATH=/ PORT=3000 pnpm --filter @workspace/arabian-startups run build
# Publish directory: artifacts/arabian-startups/dist/public
# Environment Variables:
#   NODE_ENV = production
# Redirect/Rewrite Rules:
#   - Source: /api/*   Destination: https://arabian-startups-api.onrender.com/api/$1   Action: Rewrite
#   - Source: /*       Destination: /index.html   Action: Rewrite
